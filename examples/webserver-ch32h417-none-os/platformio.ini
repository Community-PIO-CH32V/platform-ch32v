; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericCH32H417QEU6_V3F, genericCH32H417QEU6_V5F

[env]
platform = ch32v
framework = noneos-sdk
monitor_speed = 115200
; uncomment this to use USB bootloader upload via WCHISP
;upload_protocol = isp
;upload_protocol = wlink
; make net_config.h discoverable and inform about modified V5F start address (see linkerscript)
build_flags = -Isrc/shared -Isrc -DCore_V5F_StartAddr=0x00020000
; default is HSI+PLL, but this example uses HSE+PLL.
board_build.clock_source = hse+pll

; BOTH FIRMWARES MUST BE UPLOADED
; The V3F firmware waits for the V5F to wake up.
; Use the "Default" environment in the project environment switcher
; And use the project task "Upload All" for easy upload.

[env:genericCH32H417QEU6_V3F]
board = genericCH32H417QEU6_V3F
build_src_filter = +<shared/*> +<v3f/*>
board_build.ldscript = Link_v3f.ld
; see linkerscript for updated sizes
board_upload.maximum_ram_size = 524288
board_upload.maximum_size = 131072

[env:genericCH32H417QEU6_V5F]
board = genericCH32H417QEU6_V5F
build_src_filter = +<shared/*> +<v5f/*>
board_build.ldscript = Link_v5f.ld
board_upload.maximum_ram_size = 393216
board_upload.maximum_size = 131072
